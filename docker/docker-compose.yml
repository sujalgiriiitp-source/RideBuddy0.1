services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ridebuddy
      POSTGRES_USER: ridebuddy
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-ridebuddy}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridebuddy -d ridebuddy"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ridebuddy-postgres:/var/lib/postgresql/data
  backend:
    build:
      context: ../backend-spring
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/ridebuddy
      DATABASE_USERNAME: ridebuddy
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-ridebuddy}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  ridebuddy-postgres:

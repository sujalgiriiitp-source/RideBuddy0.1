spring:
  application:
    name: ridebuddy-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ridebuddy}
    username: ${DATABASE_USERNAME:ridebuddy}
    password: ${DATABASE_PASSWORD:ridebuddy}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
ridebuddy:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@ridebuddy.local}
